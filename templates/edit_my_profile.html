<!DOCTYPE html>
<html>
<head>
    <title>Edit My Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4" style="font-family:Arial;">

<h3>Edit My Profile</h3>

<form method="post" style="max-width:400px;">
    
    <label>Username</label>
    <input class="form-control" type="text" value="{{ user.username }}" disabled>
    <small class="text-muted">Username cannot be changed</small>

    <label class="mt-3">Age</label>
    <input class="form-control" type="number" name="age" value="{{ patient.age if patient.age else '' }}">

    <label class="mt-3">Gender</label>
    <select class="form-control" name="gender">
        <option value="">Select Gender</option>
        <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
        <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
        <option value="Other" {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
    </select>

    <label class="mt-3">Contact</label>
    <input class="form-control" type="text" name="contact" value="{{ patient.contact if patient.contact else '' }}">

    <button class="btn btn-success mt-3">Save Changes</button>
</form>

<a href="/patient_dashboard" class="btn btn-secondary mt-3">Back</a>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>All Doctors</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4" style="font-family:Arial;">

<h3>All Doctors</h3>

<table class="table table-bordered">
    <tr>
        <th>Username</th>
        <th>Name</th>
        <th>Specialization</th>
        <th>Experience</th>
        <th>Actions</th>
    </tr>

    {% for d, u in doctors %}
    <tr>
        <td>{{ u.username }}</td>
        <td>{{ d.name }}</td>
        <td>{{ d.specialization }}</td>
        <td>{{ d.experience }}</td>
        <td>
            <a class="btn btn-sm btn-warning" href="/edit_doctor/{{ d.id }}">Edit</a>
            <a class="btn btn-sm btn-danger" href="/delete_doctor/{{ d.id }}" 
               onclick="return confirm('Delete this doctor?');">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

<a href="/admin" class="btn btn-secondary">Back</a>

</body>
</html>

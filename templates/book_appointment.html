<!DOCTYPE html>
<html>
<head>
    <title>Book Appointment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">

<h3>Book Appointment with Dr. {{ doctor.name }}</h3>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<form method="post" style="max-width:400px;">

    <label>Select Slot</label>
    <select name="slot" class="form-control" required>
        {% for a in avails %}
        <option value="{{ a.date }} | {{ a.slot }}">
            {{ a.date }} — {{ a.slot }}
        </option>
        {% endfor %}
    </select>

    <button class="btn btn-primary mt-3">Book</button>
</form>

<a href="/view_doctor/{{ doctor.id }}" class="btn btn-secondary mt-3">Back</a>

</body>
</html>

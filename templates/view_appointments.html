<!DOCTYPE html>
<html>
<head>
    <title>All Appointments</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">

<h3>All Appointments</h3>

<table class="table table-bordered">
    <tr>
        <th>Patient</th>
        <th>Doctor</th>
        <th>Date</th>
        <th>Time</th>
        <th>Status</th>
    </tr>

    {% for a, p, pu, d, du in full_list %}
    <tr>
        <td>{{ pu.username }}</td>
        <td>{{ du.username }} ({{ d.specialization }})</td>
        <td>{{ a.date }}</td>
        <td>{{ a.time }}</td>
        <td>{{ a.status }}</td>
    </tr>
    {% endfor %}
</table>

<a href="/admin" class="btn btn-secondary">Back</a>

</body>
</html>

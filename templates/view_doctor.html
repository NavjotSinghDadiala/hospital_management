<!DOCTYPE html>
<html>
<head>
    <title>Doctor Details</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">

<h3>Doctor Details</h3>

<p><b>Name:</b> {{ doctor.name }}</p>
<p><b>Specialization:</b> {{ doctor.specialization }}</p>
<p><b>Experience:</b> {{ doctor.experience }}</p>

<h4 class="mt-4">Available Slots</h4>

<table class="table table-bordered">
    <tr>
        <th>Date</th>
        <th>Slot</th>
    </tr>

    {% for a in avails %}
    <tr>
        <td>{{ a.date }}</td>
        <td>{{ a.slot }}</td>
    </tr>
    {% endfor %}
</table>

<a href="/book_appointment/{{ doctor.id }}" class="btn btn-success">Book Appointment</a>
<a href="/search_doctors" class="btn btn-secondary">Back</a>

</body>
</html>

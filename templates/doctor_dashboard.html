<!DOCTYPE html>
<html>
<head>
    <title>Doctor Dashboard</title>
</head>
<body style="font-family:Arial; background:#f4f7fa;">

    <h2 style="text-align:center; padding:20px; background:#198754; color:white;">
        Doctor Dashboard
    </h2>

    <div style="padding:20px; max-width:600px; margin:auto;">

        <h3>Doctor Details</h3>
        <p>Name: <b>{{ doctor.name }}</b></p>
        <p>Specialization: <b>{{ doctor.specialization }}</b></p>
        <p>Experience: <b>{{ doctor.experience }}</b></p>

        <hr>

        <h3>Options</h3>
        <ul>
            <li><a href="/doctor_appointments">View My Appointments</a></li>
            <li><a href="/add_availability">Set Availability</a></li>
            <li><a href="/patient_history">View Patient History</a></li>
        </ul>

        <br><br>
        <a href="/logout" style="color:red;">Logout</a>

    </div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>All Patients</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4" style="font-family:Arial;">

<h3>All Patients</h3>

<table class="table table-bordered">
    <tr>
        <th>Username</th>
        <th>Age</th>
        <th>Gender</th>
        <th>Contact</th>
    </tr>

    {% for u, p in patients %}
    <tr>
        <td>{{ u.username }}</td>
        <td>{{ p.age }}</td>
        <td>{{ p.gender }}</td>
        <td>{{ p.contact }}</td>
    </tr>
    {% endfor %}
</table>

<a href="/admin" class="btn btn-secondary">Back</a>

</body>
</html>

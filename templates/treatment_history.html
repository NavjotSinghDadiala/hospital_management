<!DOCTYPE html>
<html>
<head>
    <title>Treatment History</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
            padding: 30px;
            color: #1f2933;
        }
        h3 {
            color: #0d6efd;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #edf0f7;
            text-align: left;
        }
        th {
            background: #eef2ff;
        }
        .btn {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 6px;
            background: #6c757d;
            color: #fff;
            text-decoration: none;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<h3>My Treatment History</h3>

<table>
    <tr>
        <th>Date</th>
        <th>Time</th>
        <th>Doctor</th>
        <th>Diagnosis</th>
        <th>Prescription</th>
        <th>Notes</th>
    </tr>

    {% for a, t, d, u in full_list %}
    <tr>
        <td>{{ a.date }}</td>
        <td>{{ a.time }}</td>
        <td>{{ d.name }} ({{ d.specialization }})</td>
        <td>{{ t.diagnosis if t else '---' }}</td>
        <td>{{ t.prescription if t else '---' }}</td>
        <td>{{ t.notes if t else '---' }}</td>
    </tr>
    {% endfor %}
</table>

<a href="/patient_dashboard" class="btn">Back</a>

</body>
</html>

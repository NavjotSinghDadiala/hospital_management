<!DOCTYPE html>
<html>
<head>
    <title>Treatment History</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">

<h3>My Treatment History</h3>

<table class="table table-bordered">
    <tr>
        <th>Date</th>
        <th>Time</th>
        <th>Doctor</th>
        <th>Diagnosis</th>
        <th>Prescription</th>
        <th>Notes</th>
    </tr>

    {% for a, t, d, u in full_list %}
    <tr>
        <td>{{ a.date }}</td>
        <td>{{ a.time }}</td>
        <td>{{ d.name }} ({{ d.specialization }})</td>
        <td>{{ t.diagnosis }}</td>
        <td>{{ t.prescription }}</td>
        <td>{{ t.notes }}</td>
    </tr>
    {% endfor %}
</table>

<a href="/patient_dashboard" class="btn btn-secondary">Back</a>

</body>
</html>

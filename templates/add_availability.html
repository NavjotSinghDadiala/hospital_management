<!DOCTYPE html>
<html>
<head>
    <title>Add Availability</title>
</head>
<body style="font-family:Arial;">
    <h2>Add Availability</h2>
    <form method="post" action="/add_availability">
        <label>Date</label><br>
        <input type="text" name="date" placeholder="YYYY-MM-DD" required><br><br>
        <label>Slot (e.g. 09:00-11:00)</label><br>
        <input type="text" name="slot" required><br><br>
        <button type="submit">Add</button>
    </form>
    <a href="/doctor_dashboard">Back</a>
</body>
</html>

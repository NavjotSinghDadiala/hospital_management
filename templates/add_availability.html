<!DOCTYPE html>
<html>
<head>
    <title>Add Availability</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">

<h3>Add Availability</h3>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<form method="post" style="max-width:400px;">

    <label>Date (Next 7 days only)</label>
    <input class="form-control" type="date" name="date" min="{{ min_date }}" max="{{ max_date }}" required>

    <label class="mt-3">Time Slot</label>
    <select class="form-control" name="slot" required>
        {% for s in slots %}
        <option value="{{ s }}">{{ s }}</option>
        {% endfor %}
    </select>

    <button class="btn btn-primary mt-3">Save</button>
</form>

<a href="/doctor_dashboard" class="btn btn-secondary mt-3">Back</a>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Add Treatment</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">

<h3>Add Treatment</h3>

<form method="post" style="max-width:500px;">

    <label>Diagnosis</label>
    <input class="form-control" type="text" name="diagnosis" required>

    <label class="mt-3">Prescription</label>
    <input class="form-control" type="text" name="prescription" required>

    <label class="mt-3">Notes</label>
    <textarea class="form-control" name="notes" rows="3"></textarea>

    <button class="btn btn-primary mt-3">Save</button>
</form>

<a class="btn btn-secondary mt-3" href="/doctor_dashboard">Back</a>

</body>
</html>

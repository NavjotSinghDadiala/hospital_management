<!DOCTYPE html>
<html>
<head>
    <title>Search Doctors</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
            padding: 30px;
            color: #1f2933;
        }
        h3 {
            margin-bottom: 15px;
            color: #0d6efd;
        }
        form input[type="text"] {
            width: 100%;
            max-width: 400px;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #edf0f7;
            text-align: left;
        }
        th {
            background: #eef2ff;
        }
        .btn {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 5px;
            text-decoration: none;
            color: #fff;
            font-size: 13px;
            margin-right: 6px;
        }
        .info { background: #17a2b8; }
        .success { background: #28a745; }
        .secondary { background: #6c757d; }
    </style>
</head>
<body>

<h3>Search Doctors</h3>

<form method="post">
    <input type="text" name="q" value="{{ q }}"
           placeholder="Search by name or specialization">
</form>

<table>
    <tr>
        <th>Name</th>
        <th>Specialization</th>
        <th>Experience</th>
        <th>Actions</th>
    </tr>

    {% for d in doctors %}
    <tr>
        <td>{{ d.name }}</td>
        <td>{{ d.specialization }}</td>
        <td>{{ d.experience }}</td>
        <td>
            <a class="btn info" href="/view_doctor/{{ d.id }}">View</a>
            <a class="btn success" href="/book_appointment/{{ d.id }}">Book</a>
        </td>
    </tr>
    {% endfor %}

    {% if doctors|length == 0 and q != "" %}
    <tr>
        <td colspan="4" style="text-align:center; color:gray;">No doctors found</td>
    </tr>
    {% endif %}
</table>

<a href="/patient_dashboard" class="btn secondary" style="margin-top:15px;">Back</a>

</body>
</html>
